         <button class="btn btn-ghost btn-full" id="ob-skip">رد کردن عکس و ثبت‌نام</button>`
      : `<button class="btn btn-primary btn-full" id="ob-skip">ادامه بدون عکس</button>`}
  </div>`;
}

